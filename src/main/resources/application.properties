spring.application.name=bank-jpa-lab

spring.application.name=bank-jpa-lab

# ---- Datasource (MySQL) ----
# createDatabaseIfNotExist=true => Spring creates the "bankdb" database
# automatically on first start — no manual CREATE DATABASE needed!
spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
# update = create/alter tables automatically from @Entity classes (DDL)
spring.jpa.hibernate.ddl-auto=update
# print every SQL statement Hibernate generates — our window into ORM!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
